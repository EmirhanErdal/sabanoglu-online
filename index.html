      d.querySelector('button').onclick = function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); };
      document.body.appendChild(d);
    }
    window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show(); }, true);
    setTimeout(show, 12000);
  })();
